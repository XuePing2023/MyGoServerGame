// ServerGame 通信协议定义（protobuf）。
//
// 帧格式（TCP）：| 4B 长度(大端, 含 2B 消息ID+消息体, 不含长度域自身) | 2B 消息ID(大端) | 消息体(protobuf) |
// 帧格式（WebSocket）：二进制帧 = | 2B 消息ID(大端) | 消息体(protobuf) |（WS 帧自带边界，无需长度前缀）
//
// 重新生成 Go 代码：
//   Windows: genproto.bat      Linux/macOS: ./genproto.sh
syntax = "proto3";

package game.v1;

option go_package = "servergame/pb/game/v1;gamepb";

// ============================================================================
// 错误码
// ============================================================================

// ErrCode 全局业务错误码，随 ErrorNotify 下发。
enum ErrCode {
  ERR_OK = 0;             // 成功
  ERR_INTERNAL = 1;       // 服务器内部错误
  ERR_BAD_REQUEST = 2;    // 请求非法（参数缺失/格式错误/未知消息）
  ERR_UNAUTHORIZED = 3;   // 尚未登录，或会话已失效
  ERR_ALREADY_EXISTS = 4; // 用户名已存在
  ERR_NOT_FOUND = 5;      // 账号或数据不存在
  ERR_PASSWORD_WRONG = 6; // 密码错误
  ERR_RATE_LIMITED = 7;   // 操作过于频繁（聊天限流等）
  ERR_NAME_INVALID = 8;   // 昵称不合法
  ERR_NAME_TAKEN = 9;     // 昵称已被占用
  ERR_IN_ROOM = 10;       // 已在房间中
  ERR_NOT_IN_ROOM = 11;   // 不在房间中
  ERR_ROOM_FULL = 12;     // 房间已满
  ERR_ROOM_NOT_FOUND = 13; // 房间不存在或已解散
  ERR_GAME_STATE = 14;    // 当前状态无法执行该操作（如人数不足）
}

// ============================================================================
// 消息 ID（uint16，网络传输时大端序）
// ============================================================================

enum MsgID {
  MSG_ID_UNKNOWN = 0;

  // ---- 系统 1~99 ----
  HEARTBEAT_REQ = 1;           // C->S 心跳
  HEARTBEAT_ACK = 2;           // S->C 心跳应答
  KICK_NOTIFY = 3;             // S->C 踢下线通知（顶号/心跳超时/维护等），收到后服务器即将断开
  ERROR_NOTIFY = 4;            // S->C 通用错误通知（对应某次请求的失败结果）
  SERVER_INFO_NOTIFY = 5;      // S->C 连接建立后立即推送的服务器信息（含心跳间隔建议）
  SERVER_BROADCAST_NOTIFY = 6; // S->C 全服公告（运维推送）
  ONLINE_COUNT_NOTIFY = 7;     // S->C 在线人数变化推送

  // ---- 账号 100~199 ----
  GUEST_LOGIN_REQ = 100;       // C->S 游客登录（设备号）
  GUEST_LOGIN_RES = 101;       // S->C 游客登录结果
  ACCOUNT_REGISTER_REQ = 102;  // C->S 账号注册
  ACCOUNT_REGISTER_RES = 103;  // S->C 注册结果
  ACCOUNT_LOGIN_REQ = 104;     // C->S 账号登录
  ACCOUNT_LOGIN_RES = 105;     // S->C 账号登录结果

  // ---- 玩家 200~299 ----
  GET_PROFILE_REQ = 200;       // C->S 查询自己的资料
  GET_PROFILE_RES = 201;       // S->C 资料返回
  RENAME_REQ = 202;            // C->S 修改昵称
  RENAME_RES = 203;            // S->C 修改昵称结果

  // ---- 聊天 300~399 ----
  WORLD_CHAT_REQ = 300;        // C->S 世界频道发言
  WORLD_CHAT_RES = 301;        // S->C 发言确认
  WORLD_CHAT_NOTIFY = 302;     // S->C 世界频道广播

  // ---- 房间（内置猜拳小游戏）400~499 ----
  CREATE_ROOM_REQ = 400;       // C->S 创建房间
  CREATE_ROOM_RES = 401;       // S->C 创建结果
  JOIN_ROOM_REQ = 402;         // C->S 加入房间
  JOIN_ROOM_RES = 403;         // S->C 加入结果
  LEAVE_ROOM_REQ = 404;        // C->S 离开房间
  LEAVE_ROOM_RES = 405;        // S->C 离开结果
  ROOM_EVENT_NOTIFY = 406;     // S->C 房间事件广播（成员变化/开局/解散）
  ROOM_CHAT_REQ = 407;         // C->S 房间内发言
  ROOM_CHAT_NOTIFY = 408;      // S->C 房间内广播
  RPS_PLAY_REQ = 409;          // C->S 猜拳出招
  RPS_PLAY_RES = 410;          // S->C 出招确认
  RPS_ROUND_NOTIFY = 411;      // S->C 单局结算（双方出招+胜负+最新资料）
}

// ============================================================================
// 通用
// ============================================================================

// Empty 空消息体（部分请求没有参数）。
message Empty {}

// HeartbeatReq 心跳请求。
message HeartbeatReq {
  int64 clientTime = 1; // 客户端当前毫秒时间戳（可传 0）
}

// HeartbeatAck 心跳应答。
message HeartbeatAck {
  int64 clientTime = 1; // 原样回传的客户端时间戳
  int64 serverTime = 2; // 服务器当前毫秒时间戳
}

// KickNotify 踢下线通知。
message KickNotify {
  string reason = 1; // 踢下线原因（如：账号在其他设备登录、心跳超时）
}

// ErrorNotify 通用错误通知。
message ErrorNotify {
  ErrCode code = 1;  // 错误码
  string msg = 2;    // 错误描述
  MsgID reqMsgId = 3; // 触发该错误的请求消息 ID（便于客户端定位）
}

// ServerInfoNotify 连接建立后服务器信息推送。
message ServerInfoNotify {
  string name = 1;               // 服务器名称
  string version = 2;            // 服务器版本
  int32 heartbeatIntervalMs = 3; // 建议客户端心跳间隔（毫秒）
  int32 idleTimeoutMs = 4;       // 无任何数据的踢下线阈值（毫秒）
  int64 serverTime = 5;          // 服务器当前毫秒时间戳
}

// ServerBroadcastNotify 全服公告。
message ServerBroadcastNotify {
  string text = 1; // 公告内容
  int64 ts = 2;    // 毫秒时间戳
}

// OnlineCountNotify 在线人数推送。
message OnlineCountNotify {
  int32 online = 1; // 当前已登录玩家数
}

// ============================================================================
// 账号
// ============================================================================

// GuestLoginReq 游客登录：以设备号为凭据，首次自动建号。
message GuestLoginReq {
  string deviceId = 1; // 客户端设备唯一标识（8~64 字符）
}

// AccountRegisterReq 账号注册。
message AccountRegisterReq {
  string username = 1; // 3~24 位字母/数字/下划线
  string password = 2; // 6~32 位任意可见字符
}

// AccountRegisterRes 注册结果（注册成功即视为已登录）。
message AccountRegisterRes {
  int64 uid = 1;             // 新账号 UID
  string username = 2;       // 用户名
  PlayerProfile profile = 3; // 自动登录后的玩家资料
}

// AccountLoginReq 账号登录。
message AccountLoginReq {
  string username = 1;
  string password = 2;
}

// LoginRes 登录结果（游客与账号登录共用）。
message LoginRes {
  bool isNew = 1;          // 是否本次新建的角色
  PlayerProfile profile = 2; // 玩家完整资料
}

// ============================================================================
// 玩家
// ============================================================================

// PlayerProfile 玩家资料。
message PlayerProfile {
  int64 uid = 1;
  string username = 2;
  string nickname = 3;
  int32 level = 4;
  int64 exp = 5;
  int64 gold = 6;
  int64 diamond = 7;
  int64 winCount = 8;   // 猜拳胜场
  int64 loseCount = 9;  // 猜拳负场
  int64 drawCount = 10; // 猜拳平局
  int64 createdAt = 11;   // 建号毫秒时间戳
  int64 lastLoginAt = 12; // 最近登录毫秒时间戳
}

// GetProfileRes 资料查询结果。
message GetProfileRes {
  PlayerProfile profile = 1;
}

// RenameReq 修改昵称。
message RenameReq {
  string nickname = 1; // 2~16 个字符（UTF-8），全局唯一
}

// RenameRes 修改昵称结果。
message RenameRes {
  string nickname = 1;
}

// ============================================================================
// 聊天
// ============================================================================

// WorldChatReq 世界频道发言。
message WorldChatReq {
  string content = 1; // 1~200 字符
}

// WorldChatRes 发言确认（发送者自己收到）。
message WorldChatRes {
  int64 ts = 1; // 服务器毫秒时间戳
}

// WorldChatNotify 世界频道广播（发送者也会收到）。
message WorldChatNotify {
  int64 uid = 1;
  string nickname = 2;
  string content = 3;
  int64 ts = 4;
}

// ============================================================================
// 房间与猜拳小游戏
// ============================================================================

// RoomMember 房间成员。
message RoomMember {
  int64 uid = 1;
  string nickname = 2;
}

// CreateRoomRes 创建房间结果。
message CreateRoomRes {
  int64 roomId = 1;
}

// JoinRoomReq 加入房间。
message JoinRoomReq {
  int64 roomId = 1; // 6 位房间号
}

// JoinRoomRes 加入房间结果。
message JoinRoomRes {
  int64 roomId = 1;
  repeated RoomMember members = 2; // 当前房间成员（含自己）
}

// LeaveRoomRes 离开房间结果。
message LeaveRoomRes {
  int64 roomId = 1;
}

// RoomEventNotify 房间事件广播。
message RoomEventNotify {
  enum EventType {
    JOIN = 0;   // 有玩家加入
    LEAVE = 1;  // 有玩家离开/掉线
    START = 2;  // 人齐开局
    CLOSE = 3;  // 房间解散
  }
  int64 roomId = 1;
  EventType type = 2;
  string text = 3;                 // 人类可读描述
  repeated RoomMember members = 4; // 事件后的成员列表（解散时为空）
  int64 ts = 5;
}

// RoomChatReq 房间内发言。
message RoomChatReq {
  string content = 1; // 1~200 字符
}

// RoomChatNotify 房间内广播（发送者也会收到）。
message RoomChatNotify {
  int64 uid = 1;
  string nickname = 2;
  string content = 3;
  int64 ts = 4;
}

// RpsPlayReq 猜拳出招。
message RpsPlayReq {
  enum Move {
    NONE = 0;
    ROCK = 1;     // 石头
    PAPER = 2;    // 布
    SCISSORS = 3; // 剪刀
  }
  Move move = 1;
}

// RpsPlayRes 出招确认（双方都出招前先各自确认）。
message RpsPlayRes {
  bool accepted = 1; // 是否接受出招（重复出招/状态不符为 false）
}

// RpsRoundNotify 单局结算广播（发给房间内双方）。
message RpsRoundNotify {
  enum Outcome {
    WIN = 0;   // 我赢了
    LOSE = 1;  // 我输了
    DRAW = 2;  // 平局
  }
  RpsPlayReq.Move myMove = 1;  // 我的出招
  RpsPlayReq.Move oppMove = 2; // 对手出招
  Outcome outcome = 3;         // 相对我的胜负
  PlayerProfile profile = 4;   // 结算奖励后的我的最新资料
  string extraMsg = 5;         // 附加提示（如升级提示），可为空
}
